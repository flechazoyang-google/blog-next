# 博客页面缓存区声明（P4）
#
# 必须放在 http{} 层 —— 即 /etc/nginx/conf.d/ 下，不能写进 server{} 块，
# 否则 nginx -t 会报 "proxy_cache_path directive is not allowed here"。
#
# 安装：
#   cp deploy/nginx-blog-cache.conf /etc/nginx/conf.d/blog-cache.conf
#   mkdir -p /var/cache/nginx/blog && chown www-data:www-data /var/cache/nginx/blog
#   nginx -t && systemctl reload nginx
#
# 容量估算：单页 HTML 约 35~50KB，32 篇文章 + 列表页 ≈ 2MB。
# 500MB 足够存下多轮历史版本，inactive=7d 会自动淘汰冷页面。

proxy_cache_path /var/cache/nginx/blog
    levels=1:2
    keys_zone=blog:20m
    max_size=500m
    inactive=7d
    use_temp_path=off;
