# Artalk 评论系统
# 部署位置：/opt/artalk/
# 启动：docker compose up -d
services:
  artalk:
    image: artalk/artalk-go:latest
    container_name: artalk
    restart: always
    ports:
      - "127.0.0.1:23366:23366"
    volumes:
      - ./data:/data
      # 注意：不能加 :ro。Artalk 后台（/sidebar）改配置时要回写这个文件，
      # 只读挂载会导致 "配置保存失败: read-only file system"
      - ./artalk.yml:/data/artalk.yml
    environment:
      - TZ=Asia/Shanghai
    mem_limit: 192m
