# Artalk 配置模板
# 用法：复制到 /opt/artalk/artalk.yml，并把 app_key 换成 openssl rand -hex 32
# 完整坑位说明见 deploy/UPGRADE.md 第十三节

host: 0.0.0.0
port: 23366

# ⚠️ type 必须是 sqlite，写 sqlite3 会 panic: unsupported database type
db:
  type: sqlite
  file: /data/artalk.db

cache:
  type: builtin
  expires: 60

# 会话签名密钥（勿泄露、勿入库）
app_key: REPLACE_ME_with_openssl_rand_hex_32

# ⚠️ 登录有效期（秒）。不配默认 0 -> JWT 的 exp == iat -> 登录后所有请求仍报未登录
# 这是最容易卡住的一个，现象是"能登录成功但立刻掉线"
login_timeout: 259200

site_default: "flechazo blog"
locale: zh-CN
timezone: Asia/Shanghai

# 跨域白名单：缺了博客域名会导致前端拿不到数据（不报错，只显示空白）
trusted_domains:
  - "https://blog.yghsite.cn"
  - "https://artalk.yghsite.cn"

# 反代：只信 nginx 的 X-Real-IP，防客户端伪造
http:
  proxy_header: X-Real-IP

# 审核：新评论默认待审
# ⚠️ 正确键名是 moderator.pending_default，写成顶层 moderator_pending 会被静默忽略
moderator:
  pending_default: true
  notify_pending: true

# 登录认证：默认全部关闭，不开的话后台报 "Email auth is not enabled"
auth:
  enabled: true
  # 允许游客匿名评论（不开则必须登录，个人博客通常要开）
  anonymous: true
  callback: "https://artalk.yghsite.cn/api/v2/auth/{provider}/callback"
  email:
    enabled: true
    verify_subject: "登录验证码 - {{code}}"
    verify_tpl: default
