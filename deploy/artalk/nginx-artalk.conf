# Artalk 站点（/etc/nginx/sites-available/artalk）
server {
    listen 80;
    listen [::]:80;
    server_name artalk.yghsite.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24：http2 只能写在 listen 行（1.25.1+ 才支持独立 http2 on;）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name artalk.yghsite.cn;

    ssl_certificate     /etc/letsencrypt/live/artalk.yghsite.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/artalk.yghsite.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:23366;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    location /admin {
        proxy_pass http://127.0.0.1:23366;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
