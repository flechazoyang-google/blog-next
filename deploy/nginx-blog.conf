server {
    server_name blog.yghsite.cn;
    client_max_body_size 12m;

    # 静态图片直出，绕过 Next.js 省内存
    location /images/ {
        alias /var/www/blog-images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 后台：不索引
    location /admin {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # 证书由 certbot 沿用原有
    listen 443 ssl;
    ssl_certificate     /etc/letsencrypt/live/blog.yghsite.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.yghsite.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = blog.yghsite.cn) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name blog.yghsite.cn;
    return 404;
}
