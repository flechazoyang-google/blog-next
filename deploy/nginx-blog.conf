server {
    server_name blog.yghsite.cn;

    # 上传大小：应用到 8MB 上限，nginx 留一点余量
    client_max_body_size 12m;

    # 静态资源直出（绕过 Next.js，省内存）
    # 注意：这里必须与 systemd 的 UPLOAD_DIR 一致（/var/www/blog-images）。
    # 仓库里曾经写成 /var/lib/blog/images/，与线上实际目录不符 —— B10。
    location /images/ {
        alias /var/www/blog-images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        # A1 的纵深防御：即使有非图片文件混进来，也不让浏览器嗅探成 HTML 执行
        types { }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        # 不允许把上传目录当作脚本执行入口
        location ~ \.(php|phtml|phar|jsp|asp|aspx|cgi|pl|py)$ {
            return 404;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A3：应用侧只信 X-Real-IP（= $remote_addr，客户端无法伪造）。
        # X-Forwarded-For 仍保留追加语义，但代码不再取它的首段。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # 后台不索引、不缓存
    location /admin {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
}
